spring.application.name=gamehub-api
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=${PORT:8080}
spring.datasource.hikari.maximum-pool-size=5
app.cors.origenes=${CORS_ORIGENES:http://localhost:5174}
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-de-al-menos-32-caracteres-aqui}
app.jwt.duracion-ms=3600000